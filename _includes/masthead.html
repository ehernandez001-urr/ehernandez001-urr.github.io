{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{% include t.html en=link.title es=link.title_es %}</a>
            </li>
          {% endfor %}
          <li class="masthead__menu-item masthead__toggles persist tail">
            <button id="lang-toggle" type="button" aria-label="Cambiar idioma / Switch language" title="English / Español">
              <i class="fa-solid fa-language" aria-hidden="true"></i><span class="i18n-en" lang="es">ES</span><span class="i18n-es" lang="en">EN</span>
            </button>
            <button id="theme-toggle" type="button" aria-label="Toggle color theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></button>
          </li>
        </ul>
        <button class="greedy-nav__toggle" type="button"><span class="navicon"></span></button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
