<div class="research-cards">
  {% for item in site.data.research %}
    <div class="research-card">
      <span class="research-card__icon">{% include icons/{{ item.icon }}.svg %}</span>
      <h3 class="research-card__title">{% include t.html en=item.title es=item.title_es %}</h3>
      <p class="research-card__text">{% include t.html en=item.text es=item.text_es %}</p>
    </div>
  {% endfor %}
</div>
